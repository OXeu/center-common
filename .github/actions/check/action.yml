name: Check a Center project
description: Run shared lint, type checks, unit and database tests, and build the consumer
runs:
  using: composite
  steps:
    - uses: ./.tmp/common/.github/actions/setup
    - name: Install Go linter
      shell: bash
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
    - shell: bash
      run: make check
    - shell: bash
      run: go test -tags=mysql ./internal/server -run TestMySQLStore -count=1
    - shell: bash
      run: make build
