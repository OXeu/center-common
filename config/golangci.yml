version: '2'

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - nilerr
    - wrapcheck
    - errorlint
    - bodyclose
    - containedctx
    - contextcheck
    - sqlclosecheck
    - govet
    - forcetypeassert
    - nilnil
    - staticcheck
    - exhaustive
    - unused
    - ineffassign
    - forbidigo
    - godox
    - revive
    - gocritic
    - nakedret
    - reassign
    - copyloopvar
    - misspell
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    govet:
      enable:
        - lostcancel
        - nilness
      disable:
        - shadow
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the structured logger
        - pattern: ^log\.(Fatal|Fatalf|Panic|Panicf|Print|Printf|Println)$
          msg: return the error, do not exit or print from library code
        - pattern: ^os\.Getenv$
          msg: read configuration through internal/config
    godox:
      keywords:
        - FIXME
        - BUG
        - HACK
        - XXX
        - TODO
    revive:
      rules:
        - name: comment-spacings
        - name: empty-block
        - name: exported
          disabled: false
          arguments:
            - disableStutteringCheck
            - disableStutteringCheck
            - checkPrivateReceivers
            - disableChecksOnConstants
        - name: unexported-return
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
    gocritic:
      enabled-tags:
        - diagnostic
        - style

      disable-all: false
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    paths:
      - node_modules
    rules:
      - linters: [bodyclose, contextcheck]
        path: internal/(server|auth)/
      - path: _test\.go
        linters:
          - wrapcheck
          - errcheck
          - forcetypeassert
          - bodyclose
          - containedctx
          - contextcheck
          - revive
          - forbidigo
      - path: internal/store/store.go
        linters:
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - node_modules
